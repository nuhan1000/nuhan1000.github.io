let lang = localStorage.getItem('appLang') || 'bn';
function t(key, ...args) {
  const entry = I18N[lang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

let scriptUrl = localStorage.getItem('appsScriptUrl') || '';
let data = null;
let syncStatus = 'no-url';

function fmtBDT(n) {
  const v = Number(n) || 0;
  return '৳' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

function applyStaticText() {
  document.getElementById('hdrTitle').textContent = t('title');
  document.getElementById('hdrSubtitle').textContent = t('subtitle');
  document.querySelector('[data-tab="dashboard"]').textContent = t('tabDashboard');
  document.querySelector('[data-tab="production"]').textContent = t('tabProduction');
  document.querySelector('[data-tab="singeing"]').textContent = t('tabSingeing');
  document.querySelector('[data-tab="lifetime"]').textContent = t('tabLifetime');
  document.querySelector('[data-tab="settings"]').textContent = t('tabSettings');
}

document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
  });
});

function setSyncStatus(status) {
  syncStatus = status;
  const label = document.getElementById('syncLabel');
  const map = { 'no-url': t('syncNoUrl'), 'syncing': t('syncSyncing'), 'ok': t('syncOk'), 'error': t('syncError') };
  label.textContent = map[status] || '';
  renderSettings();
}

async function fetchFromSheet() {
  if (!scriptUrl) { setSyncStatus('no-url'); return; }
  setSyncStatus('syncing');
  try {
    const r = await fetch(scriptUrl);
    const json = await r.json();
    data = json;
    setSyncStatus('ok');
    renderAll();
  } catch (e) {
    setSyncStatus('error');
  }
}

async function pushAction(action) {
  if (!scriptUrl) return false;
  setSyncStatus('syncing');
  try {
    await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(action),
    });
    await fetchFromSheet();
    return true;
  } catch (e) {
    setSyncStatus('error');
    return false;
  }
}

function renderAll() {
  applyStaticText();
  renderDashboard();
  renderProduction();
  renderSingeing();
  renderLifetime();
  renderSettings();
}

function emptyNotice() {
  return `<div class="corp-card p-10 text-center text-slate-500 font-semibold text-sm my-6 border-dashed border-2">${t('emptyNotice')}</div>`;
}

function plMarkup(v) {
  const n = Number(v) || 0;
  const isPos = n >= 0;
  const colorClass = isPos ? 'text-fintechGreen-600' : 'text-fintechRed-600';
  const bgBadge = isPos ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200';
  return `<div class="inline-flex items-center gap-1.5 font-extrabold ${colorClass} px-3 py-1 rounded-full text-sm border ${bgBadge}">
            <span class="inline-block w-2 h-2 rounded-full ${isPos ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
            ${fmtBDT(n)}
          </div>`;
}

function renderDashboard() {
  const el = document.getElementById('panel-dashboard');
  if (!data) { el.innerHTML = emptyNotice(); return; }

  const p4 = sum(data.weeks, 'myProfit');
  const p2 = sum(data.weeks, 'twoMachineProfit');

        <div class="flex justify-between items-center mb-6 border-b border-slate-700/60 pb-4">
          <h2 class="font-serif font-bold text-slate-100 text-lg sm:text-xl tracking-wide">${t('prodCardTitle')}</h2>
          <span class="text-[10px] font-extrabold tracking-widest text-blue-300 bg-blue-900/60 border border-blue-400/30 px-3 py-1 rounded-full uppercase">${t('tag24_4_2')}</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-corp-800/60 backdrop-blur border border-slate-700/50 p-5 rounded-2xl">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">${t('label24')}</div>
            <div class="text-2xl font-black text-slate-100 tracking-tight">${fmtBDT(p24)}</div>
          </div>
          <div class="bg-emerald-950/40 backdrop-blur border border-emerald-500/30 p-5 rounded-2xl relative">
            <div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1">${t('label4')}</div>
            <div class="text-2xl font-black text-emerald-300 tracking-tight">${fmtBDT(p4)}</div>
            <span class="absolute top-3 right-3 text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-extrabold">MY SHARE</span>
          </div>
          <div class="bg-corp-800/60 backdrop-blur border border-slate-700/50 p-5 rounded-2xl">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">${t('label2')}</div>
            <div class="text-2xl font-black text-slate-100 tracking-tight">${fmtBDT(p2)}</div>
          </div>
        </div>
      </div>

      <!-- Section 2: Combined Statements -->
      <div class="corp-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
          <h2 class="font-bold text-corp-900 text-base tracking-tight">${t('overallTitle')}</h2>
          <span class="text-[10px] font-extrabold tracking-wider text-amber-700 bg-gold-50 border border-amber-200 px-3 py-1 rounded-full uppercase">${t('tagCombined')}</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-slate-100">
          <div class="p-6">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">${t('labelSingeingIncome')}</div>
            <div class="text-xl font-black text-amber-600">${fmtBDT(singeingIncome)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">${t('labelCombinedIncome')}</div>
            <div class="text-xl font-black text-emerald-600">${fmtBDT(combined)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${t('labelYearPL', yearLabel)}</div>
            <div>${plMarkup(yearPL)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${t('labelLifetimePL')}</div>
            <div>${plMarkup(lifetimePL)}</div>
          </div>
        </div>
      </div>

      <!-- Section 3: Business Assumptions -->
      <div class="corp-card p-6 border-l-4 border-l-corp-500">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-bold text-corp-900 text-base">${t('assumpTitle')}</h3>
        </div>
        <p class="text-xs text-slate-500 mb-5 font-medium">${t('assumpDesc')}</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">${t('assumpMarket')}</label>
            <input class="input-field w-full text-sm font-bold text-corp-900" id="assump-market" type="number" value="${data.assumptions.marketRate}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">${t('assumpMachines')}</label>
            <input class="input-field w-full text-sm font-bold text-corp-900" id="assump-machines" type="number" value="${data.assumptions.totalMachines}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">${t('assumpSingeing')}</label>
            <input class="input-field w-full text-sm font-bold text-corp-900" id="assump-singeing" type="number" value="${data.assumptions.singeingRate}" />
          </div>
        </div>
        <button class="bg-corp-900 hover:bg-corp-800 active:scale-[0.99] text-white font-bold text-xs py-3 px-6 rounded-xl transition shadow-md shadow-corp-900/20" onclick="saveAssumptions()">${t('btnSaveAssump')}</button>
      </div>
    </div>`;
}

async function saveAssumptions() {
  const marketRate = Number(document.getElementById('assump-market').value) || 0;
  const totalMachines = Number(document.getElementById('assump-machines').value) || 0;
  const singeingRate = Number(document.getElementById('assump-singeing').value) || 0;
  await pushAction({ action: 'updateAssumptions', marketRate, totalMachines, singeingRate });
}

function renderProduction() {
  const el = document.getElementById('panel-production');
  if (!data) { el.innerHTML = emptyNotice(); return; }
  el.innerHTML = `<div class="space-y-4">` + data.weeks.map((w, i) => `
    <div class="corp-card p-6 border-l-4 border-l-corp-900 hover:border-l-corp-500 transition">
      <div class="flex justify-between items-center mb-4">
        <div class="font-bold text-corp-900 text-base">${t('weekLabel', w.week)}</div>
        <span class="text-[10px] font-extrabold uppercase bg-slate-100 text-slate-600 px-3 py-1 rounded-md">WEEKLY ENTRY</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">তারিখ (Date)</label>
          <input class="input-field text-sm font-semibold w-full" id="prod-date-${i}" placeholder="${t('datePlaceholder')}" value="${w.date || ''}" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">মোট পিস (Total Pieces)</label>
          <input class="input-field text-sm font-semibold w-full" id="prod-pieces-${i}" type="number" placeholder="${t('piecesPlaceholder')}" value="${w.totalPieces || ''}" />
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs mb-5 bg-slate-50 p-4 rounded-xl border border-slate-100">
        <div><span class="text-slate-400 block text-[10px] uppercase font-bold">${t('statThaan')}</span> <b class="text-corp-900 text-sm font-extrabold">${w.weeklyThaan}</b></div>
        <div><span class="text-slate-400 block text-[10px] uppercase font-bold">${t('statTotalProfit')}</span> <b class="text-corp-900 text-sm font-extrabold">${fmtBDT(w.totalProfit)}</b></div>
        <div><span class="text-slate-400 block text-[10px] uppercase font-bold">${t('statMyProfit')}</span> <b class="text-emerald-600 text-sm font-extrabold">${fmtBDT(w.myProfit)}</b></div>
        <div><span class="text-slate-400 block text-[10px] uppercase font-bold">${t('stat2Machine')}</span> <b class="text-corp-900 text-sm font-extrabold">${fmtBDT(w.twoMachineProfit)}</b></div>
        <div><span class="text-slate-400 block text-[10px] uppercase font-bold">${t('statCombined')}</span> <b class="text-emerald-600 text-sm font-extrabold">${fmtBDT(w.combinedProfit)}</b></div>
      </div>
      <button class="w-full bg-corp-900 hover:bg-corp-800 text-white font-bold text-xs py-3 rounded-xl transition shadow-md" onclick="saveWeek(${i})">${t('btnSaveSheet')}</button>
    </div>
  `).join('') + `</div>`;
}

async function saveWeek(i) {
  const date = document.getElementById('prod-date-' + i).value;
  const totalPieces = Number(document.getElementById('prod-pieces-' + i).value) || 0;
  await pushAction({ action: 'updateWeek', weekIndex: i + 1, date, totalPieces });
}

function renderSingeing() {
  const el = document.getElementById('panel-singeing');
  if (!data) { el.innerHTML = emptyNotice(); return; }
  el.innerHTML = `<div class="space-y-3">` + data.singeing.map((s, i) => `
    <div class="corp-card p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <div class="font-bold text-corp-900 text-base">${t('weekLabel', s.week)}</div>
        <div class="text-xs text-slate-500 font-medium mt-0.5">${s.date} · ${t('payLabel')} <span class="font-extrabold text-corp-900">${fmtBDT(s.pay)}</span></div>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <input class="input-field text-sm font-bold w-full sm:w-36" id="sing-${i}" type="number" placeholder="${t('singedPlaceholder')}" value="${s.singedThaan || ''}" />
        <button class="bg-corp-900 hover:bg-corp-800 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition whitespace-nowrap shadow-sm" onclick="saveSingeing(${i})">${t('btnSave')}</button>
      </div>
    </div>
  `).join('') + `</div>`;
}

async function saveSingeing(i) {
  const singedThaan = Number(document.getElementById('sing-' + i).value) || 0;
  await pushAction({ action: 'updateSingeing', weekIndex: i + 1, singedThaan });
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderLifetime() {
  const el = document.getElementById('panel-lifetime');
  if (!data) { el.innerHTML = emptyNotice(); return; }

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonthName = MONTH_NAMES[now.getMonth()];
  const curIndex = data.lifetime.findIndex(r => Number(r.year) === curYear && r.month === curMonthName);
  const cur = curIndex >= 0 ? data.lifetime[curIndex] : null;

  const currentCardHtml = cur ? `
    <div class="corp-card overflow-hidden mb-6 border-2 border-corp-500/20">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
        <h2 class="font-bold text-corp-900 text-base">${t('curEntryTitle', cur.month, cur.year)}</h2>
        <span class="text-[10px] font-extrabold tracking-wider text-emerald-700 bg-fintechGreen-50 border border-emerald-200 px-3 py-1 rounded-full uppercase">${t('tagCurMonth')}</span>
      </div>
      <div class="p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">${t('labelInvestment')}</label>
            <input class="input-field w-full text-sm font-bold text-corp-900" id="life-cur-inv" type="number" value="${cur.investment || ''}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">${t('labelMonthlyIncome')}</label>
            <input class="input-field w-full text-sm font-bold text-corp-900" id="life-cur-inc" type="number" value="${cur.monthlyIncome || ''}" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-500 mb-5 bg-slate-50 p-4 rounded-xl border border-slate-100 font-medium">
          <div>${t('statYearCum')} <b class="text-corp-900 block text-sm font-extrabold mt-0.5">${fmtBDT(cur.cumIncomeYear)}</b></div>
          <div>${t('statYearPL')} <b class="${Number(cur.profitLossYear) >= 0 ? 'text-fintechGreen-600' : 'text-fintechRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossYear)}</b></div>
          <div>${t('statLifetimePL')} <b class="${Number(cur.profitLossLifetime) >= 0 ? 'text-fintechGreen-600' : 'text-fintechRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossLifetime)}</b></div>
        </div>
        <button class="w-full bg-corp-500 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-md shadow-blue-500/20" onclick="saveCurrentLifetime(${curIndex})">${t('btnSaveSheet')}</button>
      </div>
    </div>` : `<div class="corp-card p-6 text-center text-slate-500 text-sm mb-6">${t('notFoundMonth', curMonthName, curYear)}</div>`;

  const yearRows = data.lifetime.filter(r => Number(r.year) === curYear);
  const yearTableRows = yearRows.map(r => `
    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
      <td class="py-3.5 px-4 font-bold text-corp-900">${r.month}</td>
      <td class="py-3.5 px-4 text-right text-slate-600 font-medium">${r.investment !== '' ? fmtBDT(r.investment) : '—'}</td>
      <td class="py-3.5 px-4 text-right text-slate-600 font-medium">${r.monthlyIncome !== '' ? fmtBDT(r.monthlyIncome) : '—'}</td>
      <td class="py-3.5 px-4 text-right font-bold ${r.profitLossYear !== '' && Number(r.profitLossYear) >= 0 ? 'text-fintechGreen-600' : (r.profitLossYear !== '' ? 'text-fintechRed-600' : 'text-slate-400')}">${r.profitLossYear !== '' ? fmtBDT(r.profitLossYear) : '—'}</td>
    </tr>`).join('');

  const byYear = {};
  data.lifetime.forEach(r => { if (r.profitLossLifetime !== '') byYear[r.year] = r; });
  const yearlySummaryRows = Object.keys(byYear).sort().map(y => {
    const r = byYear[y];
    return `<tr class="hover:bg-slate-50 transition border-b border-slate-100">
      <td class="py-3.5 px-4 font-bold text-corp-900">${y}</td>
      <td class="py-3.5 px-4 text-right text-slate-600 font-medium">${fmtBDT(r.cumInvestLifetime)}</td>
      <td class="py-3.5 px-4 text-right text-slate-600 font-medium">${fmtBDT(r.cumIncomeLifetime)}</td>
      <td class="py-3.5 px-4 text-right font-bold ${Number(r.profitLossLifetime) >= 0 ? 'text-fintechGreen-600' : 'text-fintechRed-600'}">${fmtBDT(r.profitLossLifetime)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = currentCardHtml + `
    <div class="space-y-6">
      <div class="corp-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
          <h2 class="font-bold text-corp-900 text-sm tracking-wide uppercase">${t('yearTableTitle', curYear)}</h2>
          <span class="text-[10px] font-extrabold tracking-wider text-slate-500 bg-slate-200/60 px-3 py-1 rounded-full uppercase">${t('tagViewOnly')}</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-100/70 text-slate-500 font-extrabold uppercase tracking-wider text-[10px] border-b border-slate-100">
              <tr>
                <th class="py-3 px-4">${t('colMonth')}</th>
                <th class="py-3 px-4 text-right">${t('colInvest')}</th>
                <th class="py-3 px-4 text-right">${t('colIncome')}</th>
                <th class="py-3 px-4 text-right">${t('colPL')}</th>
              </tr>
            </thead>
            <tbody>${yearTableRows}</tbody>
          </table>
        </div>
      </div>

      <div class="corp-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
          <h2 class="font-bold text-corp-900 text-sm tracking-wide uppercase">${t('yearlySummaryTitle')}</h2>
          <span class="text-[10px] font-extrabold tracking-wider text-slate-500 bg-slate-200/60 px-3 py-1 rounded-full uppercase">${t('tagRange')}</span>
        </div>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-100/70 text-slate-500 font-extrabold uppercase tracking-wider text-[10px] border-b border-slate-100 sticky top-0 z-10">
              <tr>
                <th class="py-3 px-4 bg-slate-100">${t('colYear')}</th>
                <th class="py-3 px-4 text-right bg-slate-100">${t('colTotalInvest')}</th>
                <th class="py-3 px-4 text-right bg-slate-100">${t('colTotalIncome')}</th>
                <th class="py-3 px-4 text-right bg-slate-100">${t('colLifetimePL')}</th>
              </tr>
            </thead>
            <tbody>${yearlySummaryRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function saveCurrentLifetime(i) {
  const investment = Number(document.getElementById('life-cur-inv').value) || 0;
  const monthlyIncome = Number(document.getElementById('life-cur-inc').value) || 0;
  const year = data.lifetime[i].year;
  const month = data.lifetime[i].month;
  await pushAction({ action: 'updateLifetimeMonth', year, month, investment, monthlyIncome });
}

function renderSettings() {
  const el = document.getElementById('panel-settings');
  const msgMap = {
    'ok': '<span class="text-fintechGreen-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgOk') + '</span>',
    'error': '<span class="text-fintechRed-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgError') + '</span>',
    'no-url': '<span class="text-slate-400 flex items-center gap-1 mt-3 text-xs font-medium">' + t('syncMsgNoUrl') + '</span>',
    'syncing': '<span class="text-gold-500 font-bold flex items-center gap-1 mt-3 text-xs animate-pulse">' + t('syncMsgSyncing') + '</span>',
  };
  el.innerHTML = `
    <div class="space-y-5 max-w-xl mx-auto">
      <div class="corp-card p-6">
        <h3 class="font-bold text-corp-900 text-base mb-1">${t('languageTitle')}</h3>
        <p class="text-xs text-slate-500 mb-4 font-medium">${t('languageDesc')}</p>
        <div class="grid grid-cols-2 gap-3">
          <button class="py-3 rounded-xl border text-xs font-extrabold transition ${lang === 'bn' ? 'border-corp-500 bg-blue-50/50 text-corp-500 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}" onclick="setLang('bn')">${t('langBangla')}</button>
          <button class="py-3 rounded-xl border text-xs font-extrabold transition ${lang === 'en' ? 'border-corp-500 bg-blue-50/50 text-corp-500 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}" onclick="setLang('en')">${t('langEnglish')}</button>
        </div>
      </div>

      <div class="corp-card p-6">
        <h3 class="font-bold text-corp-900 text-base mb-1">${t('settingsTitle')}</h3>
        <p class="text-xs text-slate-500 mb-4 font-medium">${t('settingsDesc')}</p>
        <input class="input-field w-full text-xs font-mono mb-4" id="urlInput" placeholder="${t('urlPlaceholder')}" value="${scriptUrl}" />
        <button class="w-full bg-corp-900 hover:bg-corp-800 text-white font-bold text-xs py-3 rounded-xl transition shadow-md" onclick="saveUrl()">${t('btnSaveSettings')}</button>
        <div id="syncMsg">${msgMap[syncStatus] || ''}</div>
      </div>
    </div>`;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('appLang', l);
  applyStaticText();
  renderAll();
}

function saveUrl() {
  scriptUrl = document.getElementById('urlInput').value.trim();
  localStorage.setItem('appsScriptUrl', scriptUrl);
  fetchFromSheet();
}

applyStaticText();
renderSettings();
if (scriptUrl) fetchFromSheet();
else setSyncStatus('no-url');
</script>

</body>
</html>
