let lang = localStorage.getItem('appLang') || 'bn';
function t(key, ...args) {
  const entry = I18N[lang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

let scriptUrl = localStorage.getItem('appsScriptUrl') || '';
let data = null;
let syncStatus = 'no-url';

function fmtBDT(n) {
  const v = Number(n) || 0;
  return '৳' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

function applyStaticText() {
  document.getElementById('hdrTitle').textContent = t('title');
  document.getElementById('hdrSubtitle').textContent = t('subtitle');
  document.querySelector('[data-tab="dashboard"]').textContent = t('tabDashboard');
  document.querySelector('[data-tab="production"]').textContent = t('tabProduction');
  document.querySelector('[data-tab="singeing"]').textContent = t('tabSingeing');
  document.querySelector('[data-tab="lifetime"]').textContent = t('tabLifetime');
  document.querySelector('[data-tab="settings"]').textContent = t('tabSettings');
}

document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
  });
});

function setSyncStatus(status) {
  syncStatus = status;
  const label = document.getElementById('syncLabel');
  const map = { 'no-url': t('syncNoUrl'), 'syncing': t('syncSyncing'), 'ok': t('syncOk'), 'error': t('syncError') };
  label.textContent = map[status] || '';
  renderSettings();
}

async function fetchFromSheet() {
  if (!scriptUrl) { setSyncStatus('no-url'); return; }
  setSyncStatus('syncing');
  try {
    const r = await fetch(scriptUrl);
    const json = await r.json();
    data = json;
    setSyncStatus('ok');
    renderAll();
  } catch (e) {
    setSyncStatus('error');
  }
}

async function pushAction(action) {
  if (!scriptUrl) return false;
  setSyncStatus('syncing');
  try {
    await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(action),
    });
    await fetchFromSheet();
    return true;
  } catch (e) {
    setSyncStatus('error');
    return false;
  }
}

function renderAll() {
  applyStaticText();
  renderDashboard();
  renderProduction();
  renderSingeing();
  renderLifetime();
  renderSettings();
}

function emptyNotice() {
  return `<div class="app-card p-8 text-center text-slate-500 font-medium text-sm my-6">${t('emptyNotice')}</div>`;
}

function plMarkup(v) {
  const n = Number(v) || 0;
  const isPos = n >= 0;
  const colorClass = isPos ? 'text-emerald-600' : 'text-rose-600';
  const bgDot = isPos ? 'bg-emerald-500' : 'bg-rose-500';
  return `<div class="flex items-center gap-1.5 font-bold ${colorClass}">
            <span class="inline-block w-2 h-2 rounded-full ${bgDot}"></span>
            ${fmtBDT(n)}
          </div>`;
}

function renderDashboard() {
  const el = document.getElementById('panel-dashboard');
  if (!data) { el.innerHTML = emptyNotice(); return; }

  const sum = (arr, key) => arr.reduce((s, x) => s + (Number(x[key]) || 0), 0);

  const p4 = sum(data.weeks, 'myProfit');
  const p2 = sum(data.weeks, 'twoMachineProfit');
  const singeingIncome = sum(data.singeing, 'pay');
  const combined = sum(data.weeks, 'combinedProfit');
  const lifetimeRows = data.lifetime.filter(r => r.profitLossLifetime !== '');
  const last = lifetimeRows.slice(-1)[0];
  const yearLabel = last ? last.year : '—';
  const yearPL = last ? last.profitLossYear : 0;
  const lifetimePL = last ? last.profitLossLifetime : 0;

  el.innerHTML = `
    <div class="space-y-6">
      <!-- Section 1 -->
      <div class="app-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">

          <span class="text-[11px] font-semibold tracking-wider text-blue-600 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full uppercase">${t('tag24_4_2')}</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-slate-100">
          <div class="p-6">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('label24')}</div>
            <div class="text-2xl font-bold text-slate-800">${fmtBDT(p24)}</div>
          </div>
          <div class="p-6 bg-emerald-50/30">
            <div class="text-xs font-semibold text-emerald-600 uppercase tracking-wider mb-1">${t('label4')}</div>
            <div class="text-2xl font-bold text-emerald-600">${fmtBDT(p4)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('label2')}</div>
            <div class="text-2xl font-bold text-slate-800">${fmtBDT(p2)}</div>
          </div>
        </div>
      </div>

      <!-- Section 2 -->
      <div class="app-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
          <h2 class="font-serif font-bold text-slate-800 text-lg">${t('overallTitle')}</h2>
          <span class="text-[11px] font-semibold tracking-wider text-amber-600 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full uppercase">${t('tagCombined')}</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-slate-100">
          <div class="p-5">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('labelSingeingIncome')}</div>
            <div class="text-xl font-bold text-amber-600">${fmtBDT(singeingIncome)}</div>
          </div>
          <div class="p-5">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('labelCombinedIncome')}</div>
            <div class="text-xl font-bold text-emerald-600">${fmtBDT(combined)}</div>
          </div>
          <div class="p-5">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('labelYearPL', yearLabel)}</div>
            <div class="text-xl font-bold">${plMarkup(yearPL)}</div>
          </div>
          <div class="p-5">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">${t('labelLifetimePL')}</div>
            <div class="text-xl font-bold">${plMarkup(lifetimePL)}</div>
          </div>
        </div>
      </div>

      <!-- Assumptions -->
      <div class="app-card p-6 border-l-4 border-l-blue-600">
        <h3 class="font-serif font-bold text-slate-800 text-base mb-1">${t('assumpTitle')}</h3>
        <p class="text-xs text-slate-500 mb-4">${t('assumpDesc')}</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">${t('assumpMarket')}</label>
            <input class="input-field w-full text-sm font-semibold" id="assump-market" type="number" value="${data.assumptions.marketRate}" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">${t('assumpMachines')}</label>
            <input class="input-field w-full text-sm font-semibold" id="assump-machines" type="number" value="${data.assumptions.totalMachines}" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">${t('assumpSingeing')}</label>
            <input class="input-field w-full text-sm font-semibold" id="assump-singeing" type="number" value="${data.assumptions.singeingRate}" />
          </div>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-xs py-2.5 px-6 rounded-xl transition shadow-md shadow-blue-500/20" onclick="saveAssumptions()">${t('btnSaveAssump')}</button>
      </div>
    </div>`;
}

async function saveAssumptions() {
  const marketRate = Number(document.getElementById('assump-market').value) || 0;
  const totalMachines = Number(document.getElementById('assump-machines').value) || 0;
  const singeingRate = Number(document.getElementById('assump-singeing').value) || 0;
  await pushAction({ action: 'updateAssumptions', marketRate, totalMachines, singeingRate });
}

function renderProduction() {
  const el = document.getElementById('panel-production');
  if (!data) { el.innerHTML = emptyNotice(); return; }
  el.innerHTML = `<div class="space-y-4">` + data.weeks.map((w, i) => `
    <div class="app-card p-5 border-l-4 border-l-slate-800 hover:border-l-blue-600 transition">
      <div class="font-serif font-bold text-slate-800 mb-3">${t('weekLabel', w.week)}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        <input class="input-field text-sm" id="prod-date-${i}" placeholder="${t('datePlaceholder')}" value="${w.date || ''}" />
        <input class="input-field text-sm" id="prod-pieces-${i}" type="number" placeholder="${t('piecesPlaceholder')}" value="${w.totalPieces || ''}" />
      </div>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-slate-500 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span>${t('statThaan')} <b class="text-slate-800">${w.weeklyThaan}</b></span>
        <span>${t('statTotalProfit')} <b class="text-slate-800">${fmtBDT(w.totalProfit)}</b></span>
        <span>${t('statMyProfit')} <b class="text-emerald-600">${fmtBDT(w.myProfit)}</b></span>
        <span>${t('stat2Machine')} <b class="text-slate-800">${fmtBDT(w.twoMachineProfit)}</b></span>
        <span>${t('statCombined')} <b class="text-emerald-600">${fmtBDT(w.combinedProfit)}</b></span>
      </div>
      <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 rounded-xl transition" onclick="saveWeek(${i})">${t('btnSaveSheet')}</button>
    </div>
  `).join('') + `</div>`;
}

async function saveWeek(i) {
  const date = document.getElementById('prod-date-' + i).value;
  const totalPieces = Number(document.getElementById('prod-pieces-' + i).value) || 0;
  await pushAction({ action: 'updateWeek', weekIndex: i + 1, date, totalPieces });
}

function renderSingeing() {
  const el = document.getElementById('panel-singeing');
  if (!data) { el.innerHTML = emptyNotice(); return; }
  el.innerHTML = `<div class="space-y-3">` + data.singeing.map((s, i) => `
    <div class="app-card p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <div class="font-serif font-bold text-slate-800 text-sm">${t('weekLabel', s.week)}</div>
        <div class="text-xs text-slate-500 mt-0.5">${s.date} · ${t('payLabel')} <span class="font-semibold text-slate-700">${fmtBDT(s.pay)}</span></div>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <input class="input-field text-sm w-full sm:w-32" id="sing-${i}" type="number" placeholder="${t('singedPlaceholder')}" value="${s.singedThaan || ''}" />
        <button class="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition whitespace-nowrap" onclick="saveSingeing(${i})">${t('btnSave')}</button>
      </div>
    </div>
  `).join('') + `</div>`;
}

async function saveSingeing(i) {
  const singedThaan = Number(document.getElementById('sing-' + i).value) || 0;
  await pushAction({ action: 'updateSingeing', weekIndex: i + 1, singedThaan });
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderLifetime() {
  const el = document.getElementById('panel-lifetime');
  if (!data) { el.innerHTML = emptyNotice(); return; }

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonthName = MONTH_NAMES[now.getMonth()];
  const curIndex = data.lifetime.findIndex(r => Number(r.year) === curYear && r.month === curMonthName);
  const cur = curIndex >= 0 ? data.lifetime[curIndex] : null;

  const currentCardHtml = cur ? `
    <div class="app-card overflow-hidden mb-6">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <h2 class="font-serif font-bold text-slate-800 text-lg">${t('curEntryTitle', cur.month, cur.year)}</h2>
        <span class="text-[11px] font-semibold tracking-wider text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full uppercase">${t('tagCurMonth')}</span>
      </div>
      <div class="p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">${t('labelInvestment')}</label>
            <input class="input-field w-full text-sm font-semibold" id="life-cur-inv" type="number" value="${cur.investment || ''}" />
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">${t('labelMonthlyIncome')}</label>
            <input class="input-field w-full text-sm font-semibold" id="life-cur-inc" type="number" value="${cur.monthlyIncome || ''}" />
          </div>
        </div>
        <div class="flex flex-wrap gap-4 text-xs text-slate-500 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
          <span>${t('statYearCum')} <b class="text-slate-800">${fmtBDT(cur.cumIncomeYear)}</b></span>
          <span>${t('statYearPL')} <b class="${Number(cur.profitLossYear) >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${fmtBDT(cur.profitLossYear)}</b></span>
          <span>${t('statLifetimePL')} <b class="${Number(cur.profitLossLifetime) >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${fmtBDT(cur.profitLossLifetime)}</b></span>
        </div>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-md shadow-blue-500/20" onclick="saveCurrentLifetime(${curIndex})">${t('btnSaveSheet')}</button>
      </div>
    </div>` : `<div class="app-card p-6 text-center text-slate-500 text-sm mb-6">${t('notFoundMonth', curMonthName, curYear)}</div>`;

  const yearRows = data.lifetime.filter(r => Number(r.year) === curYear);
  const yearTableRows = yearRows.map(r => `
    <tr class="hover:bg-slate-50/80 transition">
      <td class="py-3 px-4 border-b border-slate-100 font-medium text-slate-800">${r.month}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right text-slate-600">${r.investment !== '' ? fmtBDT(r.investment) : '—'}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right text-slate-600">${r.monthlyIncome !== '' ? fmtBDT(r.monthlyIncome) : '—'}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right font-semibold ${r.profitLossYear !== '' && Number(r.profitLossYear) >= 0 ? 'text-emerald-600' : (r.profitLossYear !== '' ? 'text-rose-600' : 'text-slate-400')}">${r.profitLossYear !== '' ? fmtBDT(r.profitLossYear) : '—'}</td>
    </tr>`).join('');

  const byYear = {};
  data.lifetime.forEach(r => { if (r.profitLossLifetime !== '') byYear[r.year] = r; });
  const yearlySummaryRows = Object.keys(byYear).sort().map(y => {
    const r = byYear[y];
    return `<tr class="hover:bg-slate-50/80 transition">
      <td class="py-3 px-4 border-b border-slate-100 font-medium text-slate-800">${y}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right text-slate-600">${fmtBDT(r.cumInvestLifetime)}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right text-slate-600">${fmtBDT(r.cumIncomeLifetime)}</td>
      <td class="py-3 px-4 border-b border-slate-100 text-right font-semibold ${Number(r.profitLossLifetime) >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${fmtBDT(r.profitLossLifetime)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = currentCardHtml + `
    <div class="space-y-6">
      <div class="app-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
          <h2 class="font-serif font-bold text-slate-800 text-base">${t('yearTableTitle', curYear)}</h2>
          <span class="text-[10px] font-semibold tracking-wider text-slate-500 bg-slate-200/60 px-2.5 py-1 rounded-full uppercase">${t('tagViewOnly')}</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-50 text-slate-400 font-semibold uppercase tracking-wider text-[10px] border-b border-slate-100">
              <tr>
                <th class="py-3 px-4">${t('colMonth')}</th>
                <th class="py-3 px-4 text-right">${t('colInvest')}</th>
                <th class="py-3 px-4 text-right">${t('colIncome')}</th>
                <th class="py-3 px-4 text-right">${t('colPL')}</th>
              </tr>
            </thead>
            <tbody>${yearTableRows}</tbody>
          </table>
        </div>
      </div>

      <div class="app-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
          <h2 class="font-serif font-bold text-slate-800 text-base">${t('yearlySummaryTitle')}</h2>
          <span class="text-[10px] font-semibold tracking-wider text-slate-500 bg-slate-200/60 px-2.5 py-1 rounded-full uppercase">${t('tagRange')}</span>
        </div>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-50 text-slate-400 font-semibold uppercase tracking-wider text-[10px] border-b border-slate-100 sticky top-0 z-10">
              <tr>
                <th class="py-3 px-4 bg-slate-50">${t('colYear')}</th>
                <th class="py-3 px-4 text-right bg-slate-50">${t('colTotalInvest')}</th>
                <th class="py-3 px-4 text-right bg-slate-50">${t('colTotalIncome')}</th>
                <th class="py-3 px-4 text-right bg-slate-50">${t('colLifetimePL')}</th>
              </tr>
            </thead>
            <tbody>${yearlySummaryRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function saveCurrentLifetime(i) {
  const investment = Number(document.getElementById('life-cur-inv').value) || 0;
  const monthlyIncome = Number(document.getElementById('life-cur-inc').value) || 0;
  const year = data.lifetime[i].year;
  const month = data.lifetime[i].month;
  await pushAction({ action: 'updateLifetimeMonth', year, month, investment, monthlyIncome });
}

function renderSettings() {
  const el = document.getElementById('panel-settings');
  const msgMap = {
    'ok': '<span class="text-emerald-600 font-semibold flex items-center gap-1 mt-2 text-xs">' + t('syncMsgOk') + '</span>',
    'error': '<span class="text-rose-600 font-semibold flex items-center gap-1 mt-2 text-xs">' + t('syncMsgError') + '</span>',
    'no-url': '<span class="text-slate-400 flex items-center gap-1 mt-2 text-xs">' + t('syncMsgNoUrl') + '</span>',
    'syncing': '<span class="text-amber-600 font-semibold flex items-center gap-1 mt-2 text-xs animate-pulse">' + t('syncMsgSyncing') + '</span>',
  };
  el.innerHTML = `
    <div class="space-y-4 max-w-xl mx-auto">
      <div class="app-card p-6">
        <h3 class="font-serif font-bold text-slate-800 text-base mb-1">${t('languageTitle')}</h3>
        <p class="text-xs text-slate-500 mb-4">${t('languageDesc')}</p>
        <div class="grid grid-cols-2 gap-3">
          <button class="py-2.5 rounded-xl border text-xs font-semibold transition ${lang === 'bn' ? 'border-blue-600 bg-blue-50 text-blue-600 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}" onclick="setLang('bn')">${t('langBangla')}</button>
          <button class="py-2.5 rounded-xl border text-xs font-semibold transition ${lang === 'en' ? 'border-blue-600 bg-blue-50 text-blue-600 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}" onclick="setLang('en')">${t('langEnglish')}</button>
        </div>
      </div>

      <div class="app-card p-6">
        <h3 class="font-serif font-bold text-slate-800 text-base mb-1">${t('settingsTitle')}</h3>
        <p class="text-xs text-slate-500 mb-4">${t('settingsDesc')}</p>
        <input class="input-field w-full text-xs font-mono mb-3" id="urlInput" placeholder="${t('urlPlaceholder')}" value="${scriptUrl}" />
        <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 rounded-xl transition shadow-md" onclick="saveUrl()">${t('btnSaveSettings')}</button>
        <div id="syncMsg">${msgMap[syncStatus] || ''}</div>
      </div>
    </div>`;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('appLang', l);
  applyStaticText();
  renderAll();
}

function saveUrl() {
  scriptUrl = document.getElementById('urlInput').value.trim();
  localStorage.setItem('appsScriptUrl', scriptUrl);
  fetchFromSheet();
}

applyStaticText();
renderSettings();
if (scriptUrl) fetchFromSheet();
else setSyncStatus('no-url');
</script>

</body>
</html>
