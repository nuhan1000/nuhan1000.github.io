<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islam Weaving Factory Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              900: '#1e293b',
              800: '#334155'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-p-4">
  <div class="max-w-4xl mx-auto p-6">
    <div class="bg-white shadow-md rounded-2xl p-6 border border-slate-200">
      <h1 class="text-2xl font-bold text-brand-900 mb-2">Islam Weaving Factory</h1>
      <p class="text-xs text-slate-500 mb-6">Rayganj, Sirajganj, Bangladesh</p>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <span class="block text-xs font-bold text-slate-500 uppercase">Current Month Investment</span>
          <input type="number" id="input-invest" class="mt-2 w-full p-2 border rounded-lg text-sm font-bold" placeholder="BDT">
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <span class="block text-xs font-bold text-slate-500 uppercase">Monthly Income</span>
          <input type="number" id="input-income" class="mt-2 w-full p-2 border rounded-lg text-sm font-bold" placeholder="BDT">
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <span class="block text-xs font-bold text-slate-500 uppercase">Production (Thaan)</span>
          <input type="number" id="input-thaan" class="mt-2 w-full p-2 border rounded-lg text-sm font-bold" placeholder="Thaan">
        </div>
      </div>
      
      <button onclick="saveData()" class="bg-slate-900 text-white font-bold text-xs py-3 px-6 rounded-xl hover:bg-slate-800 transition">Save Data</button>
    </div>
  </div>

  <script>
    function saveData() {
      const invest = document.getElementById('input-invest').value;
      const income = document.getElementById('input-income').value;
      const thaan = document.getElementById('input-thaan').value;
      
      localStorage.setItem('islam_weaving_data', JSON.stringify({ invest, income, thaan }));
      alert('Data successfully saved!');
    }
  </script>
</body>
</html>
