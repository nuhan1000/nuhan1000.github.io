<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Profit Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
        }

        /* Header & Online Sync Light */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title-group h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .month-badge {
            display: inline-block;
            background-color: #e8f4fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Online Sync Notification Light Style */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
        }

        .sync-light {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }

        .input-profit {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-profit:focus {
            border-color: #3498db;
        }

        /* Combined Income Row Styling */
        .combined-row {
            background-color: #f0fdf4;
            font-weight: bold;
        }

        .combined-row td {
            border-top: 2px solid #2ecc71;
            border-bottom: 2px solid #2ecc71;
            color: #166534;
            font-size: 16px;
        }

        .total-amount {
            font-size: 18px;
            color: #15803d;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <!-- Header with Auto Month & Sync Light -->
    <div class="header-area">
        <div class="title-group">
            <h2>Production & Profit Chart</h2>
            <div class="month-badge" id="currentMonth">-- ----</div>
        </div>
        
        <!-- Online Sync Notification Light -->
        <div class="sync-status">
            <span class="sync-light"></span>
            <span>Online Sync</span>
        </div>
    </div>

    <!-- Main Calculation Table -->
    <table>
        <thead>
            <tr>
                <th>উৎপাদন / সার্ভিস</th>
                <th>প্রফিট পরিমাণ (৳)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>২৪ মেশিন প্রডাকশন</td>
                <td><input type="number" class="input-profit" value="0" oninput="calculateTotal()"></td>
            </tr>
            <tr>
                <td>৪ মেশিন প্রডাকশন</td>
                <td><input type="number" class="input-profit" value="0" oninput="calculateTotal()"></td>
            </tr>
            <tr>
                <td>২ মেশিন প্রডাকশন</td>
                <td><input type="number" class="input-profit" value="0" oninput="calculateTotal()"></td>
            </tr>
            <tr>
                <td>Singing Income</td>
                <td><input type="number" class="input-profit" value="0" oninput="calculateTotal()"></td>
            </tr>
            <tr class="combined-row">
                <td>Combined Income (মোট প্রফিট)</td>
                <td><span id="combinedIncome" class="total-amount">৳ 0</span></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // ১. ক্যালেন্ডার থেকে অটোমেটিক চলতি মাস ও বছর সেট করার ফংশন
    function setAutomaticMonth() {
        const date = new Date();
        const options = { month: 'long', year: 'numeric' };
        const formattedMonth = date.toLocaleDateString('bn-BD', options); // বাংলা ফরম্যাট
        // ইংরেজি নাম চাইলে নিচের লাইন ব্যবহার করতে পারেন:
        // const formattedMonth = date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        
        document.getElementById('currentMonth').innerText = formattedMonth;
    }

    // ২. প্রফিট অটোমেটিক যোগ করার ফংশন
    function calculateTotal() {
        const inputs = document.querySelectorAll('.input-profit');
        let total = 0;
        
        inputs.forEach(input => {
            const val = parseFloat(input.value);
            if (!isNaN(val)) {
                total += val;
            }
        });

        document.getElementById('combinedIncome').innerText = '৳ ' + total.toLocaleString('bn-BD');
    }

    // পেজ লোড হওয়ার সাথে সাথে রন করবে
    window.onload = function() {
        setAutomaticMonth();
        calculateTotal();
    };
</script>

</body>
</html>
