let lang = localStorage.getItem('appLang') || 'bn';
function t(key, ...args) {
  const entry = I18N[lang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

let scriptUrl = localStorage.getItem('appsScriptUrl') || '';
let data = null;
let syncStatus = 'no-url';

function fmtBDT(n) {
  const v = Number(n) || 0;
  return '৳' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

function applyStaticText() {
  document.getElementById('hdrTitle').textContent = t('title');
  document.getElementById('hdrSubtitle').textContent = t('subtitle');
  document.querySelector('[data-tab="dashboard"]').textContent = t('tabDashboard');
  document.querySelector('[data-tab="production"]').textContent = t('tabProduction');
  document.querySelector('[data-tab="singeing"]').textContent = t('tabSingeing');
  document.querySelector('[data-tab="lifetime"]').textContent = t('tabLifetime');
  document.querySelector('[data-tab="settings"]').textContent = t('tabSettings');
}

document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
  });
});

const SYNC_BTN_STYLES = {
  'syncing': { btn: 'bg-red-700 hover:bg-red-600 border border-red-400/50 text-white shadow-red-950/50', dot: 'bg-red-200 text-red-200' },
  'error':   { btn: 'bg-red-700 hover:bg-red-600 border border-red-400/50 text-white shadow-red-950/50', dot: 'bg-red-200 text-red-200' },
  'ok':      { btn: 'bg-emerald-800 hover:bg-emerald-700 border border-emerald-500/40 text-white shadow-emerald-950/50', dot: 'bg-emerald-300 text-emerald-300' },
  'no-url':  { btn: 'bg-slate-700 hover:bg-slate-600 border border-slate-400/40 text-white shadow-slate-950/50', dot: 'bg-slate-300 text-slate-300' },
};

function setSyncStatus(status) {
  syncStatus = status;
  const label = document.getElementById('syncLabel');
  const map = { 'no-url': t('syncNoUrl'), 'syncing': t('syncSyncing'), 'ok': t('syncOk'), 'error': t('syncError') };
  label.textContent = map[status] || '';

  const style = SYNC_BTN_STYLES[status] || SYNC_BTN_STYLES['no-url'];
  const btnEl = document.getElementById('syncBtn');
  const dotEl = document.getElementById('syncDot');
  btnEl.className = 'rounded-full px-4 py-2 text-xs font-bold flex items-center gap-2 shadow-lg transition ' + style.btn;
  dotEl.className = 'status-dot-breathe inline-flex rounded-full h-2.5 w-2.5 ' + style.dot;

  renderSettings();
}

async function fetchFromSheet() {
  if (!scriptUrl) { setSyncStatus('no-url'); return; }
  setSyncStatus('syncing');
  try {
    const r = await fetch(scriptUrl);
    const json = await r.json();
    data = json;
    setSyncStatus('ok');
    renderAll();
  } catch (e) {
    setSyncStatus('error');
  }
}

async function pushAction(action) {
  if (!scriptUrl) return false;
  setSyncStatus('syncing');
  try {
    await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(action),
    });
    await fetchFromSheet();
    return true;
  } catch (e) {
    setSyncStatus('error');
    return false;
  }
}

function renderAll() {
  applyStaticText();
  renderDashboard();
  renderProduction();
  renderSingeing();
  renderLifetime();
  renderSettings();
}

function emptyNotice() {
  return `<div class="glass-card p-12 text-center text-slate-700 font-semibold text-sm my-6 border-dashed border-2 border-white/60">${t('emptyNotice')}</div>`;
}

function plMarkup(v) {
  const n = Number(v) || 0;
  const isPos = n >= 0;
  const colorClass = isPos ? 'text-finGreen-600' : 'text-finRed-600';
  const bgBadge = isPos ? 'bg-emerald-50/90 border-emerald-300' : 'bg-rose-50/90 border-rose-300';
  return `<div class="inline-flex items-center gap-1.5 font-extrabold ${colorClass} px-3.5 py-1.5 rounded-full text-sm border ${bgBadge} shadow-sm">
            <span class="inline-block w-2 h-2 rounded-full ${isPos ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
            ${fmtBDT(n)}
          </div>`;
}

function liveBadge(size) {
  const big = size === 'lg';
  const pad = big ? 'px-4 py-2' : 'px-3 py-1.5';
  const textSize = big ? 'text-xs' : 'text-[10px]';
  const dotSize = big ? 'h-2.5 w-2.5' : 'h-2 w-2';
  const iconBox = big ? 'w-5 h-5 -top-2.5 -right-2.5' : 'w-4 h-4 -top-2 -right-2';
  return `<span class="relative inline-flex items-center gap-2 ${textSize} font-extrabold tracking-widest text-white bg-gradient-to-r from-red-600 to-red-500 ${pad} rounded-full uppercase live-badge-glow">
            <span class="relative flex ${dotSize}">
              <span class="live-fast-ping absolute inline-flex h-full w-full rounded-full bg-red-200 opacity-90"></span>
              <span class="relative inline-flex rounded-full ${dotSize} bg-white"></span>
            </span>
            LIVE
            <span class="absolute ${iconBox} bg-white text-red-600 rounded-full flex items-end justify-center gap-[1.5px] px-0.5 pb-0.5 shadow-md border border-red-200">
              <span class="w-[2px] h-[3px] bg-red-600 rounded-sm"></span>
              <span class="w-[2px] h-[5px] bg-red-600 rounded-sm"></span>
              <span class="w-[2px] h-[7px] bg-red-600 rounded-sm"></span>
            </span>
          </span>`;
}

function renderDashboard() {
  const el = document.getElementById('panel-dashboard');

            <div class="text-2xl font-black text-emerald-300 tracking-tight">${fmtBDT(p4)}</div>
            <span class="absolute top-3 right-3 text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-extrabold">MY SHARE</span>
          </div>
          <div class="bg-white/5 border border-white/10 p-5 rounded-2xl shadow-inner">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">${t('label2')}</div>
            <div class="text-2xl font-black text-slate-100 tracking-tight">${fmtBDT(p2)}</div>
          </div>
          <div class="bg-luxuryGold-400/10 border border-luxuryGold-400/30 p-5 rounded-2xl shadow-inner">
            <div class="text-[11px] font-bold text-luxuryGold-400 uppercase tracking-wider mb-1">${t('labelSingeingIncome', getCurrentMonthName())}</div>
            <div class="text-2xl font-black text-luxuryGold-400 tracking-tight">${fmtBDT(singeingIncome)}</div>
          </div>
          <div class="bg-emerald-500/10 border border-emerald-500/30 p-5 rounded-2xl shadow-inner">
            <div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1">${t('labelCombinedIncome')}</div>
            <div class="text-2xl font-black text-emerald-300 tracking-tight">${fmtBDT(combined)}</div>
          </div>
        </div>
      </div>

      <div class="glass-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200/60 flex justify-between items-center bg-white/40">
          <h2 class="font-bold text-brand-900 text-base tracking-tight">${t('overallTitle')}</h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 divide-y sm:divide-y-0 sm:divide-x divide-slate-200/60">
          <div class="p-6">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${t('labelYearIncome', yearLabel)}</div>
            <div class="text-xl font-black text-brand-900">${fmtBDT(yearIncomeToDate)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${t('labelYearPL', yearLabel)}</div>
            <div>${plMarkup(yearPL)}</div>
          </div>
          <div class="p-6">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${t('labelLifetimePL')}</div>
            <div>${plMarkup(lifetimePL)}</div>
          </div>
        </div>
      </div>

      <div class="glass-card p-6 border-l-4 border-l-brand-600">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-bold text-brand-900 text-base">${t('assumpTitle')}</h3>
        </div>
        <p class="text-xs text-slate-600 mb-5 font-medium">${t('assumpDesc')}</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">${t('assumpMarket')}</label>
            <input class="input-field w-full text-sm font-bold text-brand-900" id="assump-market" type="number" value="${data.assumptions.marketRate}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">${t('assumpMachines')}</label>
            <input class="input-field w-full text-sm font-bold text-brand-900" id="assump-machines" type="number" value="${data.assumptions.totalMachines}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">${t('assumpSingeing')}</label>
            <input class="input-field w-full text-sm font-bold text-brand-900" id="assump-singeing" type="number" value="${data.assumptions.singeingRate}" />
          </div>
        </div>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="saveAssumptions()">${t('btnSaveAssump')}</button>

}

async function saveAssumptions() {
  const marketRate = Number(document.getElementById('assump-market').value) || 0;
  const totalMachines = Number(document.getElementById('assump-machines').value) || 0;
  const singeingRate = Number(document.getElementById('assump-singeing').value) || 0;
  await pushAction({ action: 'updateAssumptions', marketRate, totalMachines, singeingRate });
}

  el.innerHTML = `<div class="space-y-4">` + data.weeks.map((w, i) => `
    <div class="glass-card p-6 border-l-4 border-l-brand-900 hover:border-l-brand-600 transition">
      <div class="flex justify-between items-center mb-4">
        <div class="font-bold text-brand-900 text-base">${t('weekLabel', w.week)}</div>
        <span class="text-[10px] font-extrabold uppercase bg-slate-200/80 text-slate-700 px-3 py-1 rounded-md">WEEKLY LOG</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">

        <div><span class="text-slate-500 block text-[10px] uppercase font-bold">${t('statTotalProfit')}</span> <b class="text-brand-900 text-sm font-extrabold">${fmtBDT(w.totalProfit)}</b></div>
        <div><span class="text-slate-500 block text-[10px] uppercase font-bold">${t('statMyProfit')}</span> <b class="text-finGreen-600 text-sm font-extrabold">${fmtBDT(w.myProfit)}</b></div>
        <div><span class="text-slate-500 block text-[10px] uppercase font-bold">${t('stat2Machine')}</span> <b class="text-brand-900 text-sm font-extrabold">${fmtBDT(w.twoMachineProfit)}</b></div>
        <div><span class="text-slate-500 block text-[10px] uppercase font-bold">${t('statCombined')}</span> <b class="text-finGreen-600 text-sm font-extrabold">${fmtBDT(w.combinedProfit)}</b></div>

      <button class="w-full glass-btn-primary font-bold text-xs py-3 rounded-xl" onclick="saveWeek(${i})">${t('btnSaveSheet')}</button>

async function saveWeek(i) {
  const date = document.getElementById('prod-date-' + i).value;
  const totalPieces = Number(document.getElementById('prod-pieces-' + i).value) || 0;
  await pushAction({ action: 'updateWeek', weekIndex: i + 1, date, totalPieces });

function renderSingeing() {
  const el = document.getElementById('panel-singeing');
  if (!data) { el.innerHTML = emptyNotice(); return; }
  el.innerHTML = `<div class="space-y-3">` + data.singeing.map((s, i) => `
    <div class="glass-card p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <div class="font-bold text-brand-900 text-base">${t('weekLabel', s.week)}</div>

      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <input class="input-field text-sm font-bold w-full sm:w-36" id="sing-${i}" type="number" placeholder="${t('singedPlaceholder')}" value="${s.singedThaan || ''}" />
        <button class="glass-btn-primary font-bold text-xs px-6 py-2.5 rounded-xl whitespace-nowrap" onclick="saveSingeing(${i})">${t('btnSave')}</button>

async function saveSingeing(i) {
  const singedThaan = Number(document.getElementById('sing-' + i).value) || 0;
  await pushAction({ action: 'updateSingeing', weekIndex: i + 1, singedThaan });
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_NAMES_BN = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

function getCurrentMonthName() {
  const idx = new Date().getMonth();
  return lang === 'bn' ? MONTH_NAMES_BN[idx] : MONTH_NAMES[idx];
}

function renderLifetime() {
  const el = document.getElementById('panel-lifetime');
  if (!data) { el.innerHTML = emptyNotice(); return; }

  const now = new Date();
  const curYear = now.getFullYear();
  const curMonthName = MONTH_NAMES[now.getMonth()];
  const curIndex = data.lifetime.findIndex(r => Number(r.year) === curYear && r.month === curMonthName);
  const cur = curIndex >= 0 ? data.lifetime[curIndex] : null;

  const currentCardHtml = cur ? `
    <div class="glass-card overflow-hidden mb-6 border-2 border-brand-600/30">
      <div class="px-6 py-4 border-b border-slate-200/60 flex justify-between items-center bg-white/40">
        <h2 class="font-bold text-brand-900 text-base">${t('curEntryTitle', cur.month, cur.year)}</h2>
        <span class="text-[10px] font-extrabold tracking-wider text-emerald-800 bg-emerald-100/80 border border-emerald-300 px-3 py-1 rounded-full uppercase">${getCurrentMonthName()}</span>
      </div>
      <div class="p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">${t('labelInvestment')}</label>
            <input class="input-field w-full text-sm font-bold text-brand-900" id="life-cur-inv" type="number" value="${cur.investment || ''}" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">${t('labelMonthlyIncome')}</label>
            <input class="input-field w-full text-sm font-bold text-brand-900" id="life-cur-inc" type="number" value="${cur.monthlyIncome || ''}" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-600 mb-5 bg-white/50 p-4 rounded-xl border border-slate-200/60 font-medium">
          <div>${t('statYearCum')} <b class="text-brand-900 block text-sm font-extrabold mt-0.5">${fmtBDT(cur.cumIncomeYear)}</b></div>
          <div>${t('statYearPL')} <b class="${Number(cur.profitLossYear) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossYear)}</b></div>
          <div>${t('statLifetimePL')} <b class="${Number(cur.profitLossLifetime) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'} block text-sm font-extrabold mt-0.5">${fmtBDT(cur.profitLossLifetime)}</b></div>
        </div>
        <button class="w-full glass-btn-primary font-bold text-xs py-3 rounded-xl" onclick="saveCurrentLifetime(${curIndex})">${t('btnSaveSheet')}</button>
      </div>
    </div>` : `<div class="glass-card p-6 text-center text-slate-600 text-sm mb-6">${t('notFoundMonth', curMonthName, curYear)}</div>`;

  const yearRows = data.lifetime.filter(r => Number(r.year) === curYear);
  const yearTableRows = yearRows.map(r => `
    <tr class="hover:bg-white/40 transition border-b border-slate-200/60">
      <td class="py-3.5 px-2 font-bold text-brand-900 truncate">${r.month}</td>
      <td class="py-3.5 px-2 text-right text-slate-700 font-medium">${r.investment !== '' ? fmtBDT(r.investment) : '—'}</td>
      <td class="py-3.5 px-2 text-right text-slate-700 font-medium">${r.monthlyIncome !== '' ? fmtBDT(r.monthlyIncome) : '—'}</td>
      <td class="py-3.5 px-2 text-right font-bold ${r.profitLossYear !== '' && Number(r.profitLossYear) >= 0 ? 'text-finGreen-600' : (r.profitLossYear !== '' ? 'text-finRed-600' : 'text-slate-400')}">${r.profitLossYear !== '' ? fmtBDT(r.profitLossYear) : '—'}</td>
    </tr>`).join('');

  const byYear = {};
  data.lifetime.forEach(r => { if (r.profitLossLifetime !== '') byYear[r.year] = r; });
  const yearlySummaryRows = Object.keys(byYear).sort().map(y => {
    const r = byYear[y];
    return `<tr class="hover:bg-white/40 transition border-b border-slate-200/60">
      <td class="py-3.5 px-4 font-bold text-brand-900">${y}</td>
      <td class="py-3.5 px-4 text-right text-slate-700 font-medium">${fmtBDT(r.cumInvestLifetime)}</td>
      <td class="py-3.5 px-4 text-right text-slate-700 font-medium">${fmtBDT(r.cumIncomeLifetime)}</td>
      <td class="py-3.5 px-4 text-right font-bold ${Number(r.profitLossLifetime) >= 0 ? 'text-finGreen-600' : 'text-finRed-600'}">${fmtBDT(r.profitLossLifetime)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = currentCardHtml + `
    <div class="space-y-6">
      <div class="glass-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200/60 flex justify-between items-center bg-white/40">
          <h2 class="font-bold text-brand-900 text-sm tracking-wide uppercase">${t('yearTableTitle', curYear)}</h2>
          ${liveBadge()}
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left table-fixed">
            <thead class="bg-white/60 text-slate-600 font-extrabold uppercase tracking-wider text-[10px] border-b border-slate-200/60">
              <tr>
                <th class="py-3 px-2">${t('colMonth')}</th>
                <th class="py-3 px-2 text-right">${t('colInvest')}</th>
                <th class="py-3 px-2 text-right">${t('colIncome')}</th>
                <th class="py-3 px-2 text-right">${t('colPL')}</th>
              </tr>
            </thead>
            <tbody>${yearTableRows}</tbody>
          </table>
        </div>
      </div>

      <div class="glass-card overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200/60 flex justify-between items-center bg-white/40">
          <h2 class="font-bold text-brand-900 text-sm tracking-wide uppercase">${t('yearlySummaryTitle')}</h2>
          ${liveBadge()}
        </div>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-xs text-left">
            <thead class="bg-white/80 text-slate-600 font-extrabold uppercase tracking-wider text-[10px] border-b border-slate-200/60 sticky top-0 z-10">
              <tr>
                <th class="py-3 px-4 bg-white/80">${t('colYear')}</th>
                <th class="py-3 px-4 text-right bg-white/80">${t('colTotalInvest')}</th>
                <th class="py-3 px-4 text-right bg-white/80">${t('colTotalIncome')}</th>
                <th class="py-3 px-4 text-right bg-white/80">${t('colLifetimePL')}</th>
              </tr>
            </thead>
            <tbody>${yearlySummaryRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function saveCurrentLifetime(i) {
  const investment = Number(document.getElementById('life-cur-inv').value) || 0;
  const monthlyIncome = Number(document.getElementById('life-cur-inc').value) || 0;
  const year = data.lifetime[i].year;
  const month = data.lifetime[i].month;
  await pushAction({ action: 'updateLifetimeMonth', year, month, investment, monthlyIncome });
}

function renderSettings() {
  const el = document.getElementById('panel-settings');
  const msgMap = {
    'ok': '<span class="text-finGreen-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgOk') + '</span>',
    'error': '<span class="text-finRed-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgError') + '</span>',
    'syncing': '<span class="text-brand-600 font-bold flex items-center gap-1 mt-3 text-xs">' + t('syncMsgSyncing') + '</span>',
    'no-url': '<span class="text-slate-500 font-medium flex items-center gap-1 mt-3 text-xs">' + t('syncMsgNoUrl') + '</span>'
  };

  el.innerHTML = `
    <div class="space-y-6">
      <div class="glass-card p-6 border-l-4 border-l-brand-900">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('settingsTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('settingsDesc')}</p>
        <div class="mb-4">
          <input class="input-field w-full text-xs font-mono text-brand-900" id="settings-url" placeholder="${t('urlPlaceholder')}" value="${scriptUrl}" />
          ${msgMap[syncStatus] || ''}
        </div>
        <button class="glass-btn-primary font-bold text-xs py-3 px-6 rounded-xl" onclick="saveSettings()">${t('btnSaveSettings')}</button>
      </div>

      <div class="glass-card p-6 border-l-4 border-l-luxuryGold-500">
        <h2 class="font-bold text-brand-900 text-base mb-1">${t('languageTitle')}</h2>
        <p class="text-xs text-slate-600 mb-4 font-medium">${t('languageDesc')}</p>
        <div class="flex gap-3">
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'bn' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('bn')">${t('langBangla')}</button>
          <button class="px-5 py-2.5 rounded-xl text-xs font-bold transition ${lang === 'en' ? 'glass-btn-primary' : 'bg-white/60 text-slate-700 border border-slate-200 hover:bg-white/90'}" onclick="setLanguage('en')">${t('langEnglish')}</button>
        </div>
      </div>
    </div>`;
}

function saveSettings() {
  const val = document.getElementById('settings-url').value.trim();
  scriptUrl = val;
  localStorage.setItem('appsScriptUrl', val);
  fetchFromSheet();
}

function setLanguage(l) {
  lang = l;
  localStorage.setItem('appLang', l);
  renderAll();
}

applyStaticText();
renderSettings();
if (scriptUrl) {
  fetchFromSheet();
} else {
  renderAll();
}
</script>
